<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Pixel Civilization · 3D spike</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #1b1f2a;
        touch-action: none;
        font: 13px/1.4 system-ui, sans-serif;
      }

      #view {
        position: fixed;
        inset: 0;
      }

      #view canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      #view.pixelated canvas {
        image-rendering: pixelated;
      }

      #panel {
        position: fixed;
        top: 12px;
        left: 12px;
        max-width: calc(100% - 48px);
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 10px 12px;
        color: #eee;
        background: rgba(20, 24, 32, 0.85);
        border-radius: 8px;
      }

      #panel .row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      #panel button {
        padding: 6px 10px;
        font: inherit;
        color: #eee;
        background: #2b3242;
        border: 1px solid #556;
        border-radius: 6px;
        cursor: pointer;
      }

      #panel button.active {
        background: #3b82f6;
        border-color: #3b82f6;
      }

      #stats {
        font: 12px/1.4 ui-monospace, Menlo, monospace;
        white-space: pre;
      }
    </style>
  </head>
  <body>
    <div id="view"></div>
    <div id="panel">
      <strong>3D rendering spike</strong>
      <div class="row">
        <button type="button" data-style="lowpoly">A · Low-poly</button>
        <button type="button" data-style="pixel">B · Pixel 3D</button>
      </div>
      <div class="row">
        <button type="button" id="stress">Stress: off</button>
        <button type="button" id="rotate">Rotate 90°</button>
      </div>
      <div id="stats"></div>
    </div>
    <script type="module" src="/src/spike3d/main.ts"></script>
  </body>
</html>
